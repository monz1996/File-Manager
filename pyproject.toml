[project]
name = "file-manager"
version = "0.1.0"
description = "Modern File Manager with Video Analytics, Syncing & Search"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "imageio-ffmpeg>=0.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
file-manager = "file_manager.main:main"
file-manager-gui = "file_manager.gui:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
